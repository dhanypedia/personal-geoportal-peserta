services:
  nextjs:
    image: ${NEXTJS_IMAGE:?Set NEXTJS_IMAGE in .env}
    container_name: nextjs_portal
    env_file:
      - .env
    depends_on:
      - geoserver
    volumes:
      # Model 3D yang diunggah disimpan aplikasi ke data/models, dengan working
      # directory /app di dalam container. Tanpa volume ini, berkasnya berada di
      # dalam container dan HILANG setiap kali container dibuat ulang.
      #
      # Cloud Build menjalankan "docker compose up -d" pada setiap push,
      # sehingga tanpa volume ini setiap deploy menghapus seluruh model 3D yang
      # pernah diunggah. Barisnya tetap ada di database, tetapi berkasnya hilang.
      - ./data:/app/data
    networks:
      - app-network
    restart: unless-stopped

  # Kata sandi diambil dari .env, bukan ditulis di sini, karena repository ini public.
  # Dengan nilai ini GeoServer memakai kata sandi tersebut setiap kali container
  # dijalankan, sehingga kata sandi bertahan setelah restart. Kalau variabelnya kosong,
  # image kartoza membuat kata sandi acak baru pada setiap start dan menuliskannya ke log.
  geoserver:
    image: kartoza/geoserver:2.24.1
    container_name: geoserver_app
    environment:
      # Image kartoza membaca INITIAL_MEMORY dan MAXIMUM_MEMORY, bukan JAVA_OPTS.
      - INITIAL_MEMORY=512m
      - MAXIMUM_MEMORY=2048m
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      # CORS tidak perlu diatur di sini. Image ini sudah mengaktifkannya pada
      # web.xml Tomcat, dan permintaan dari browser melewati Nginx sehingga
      # berasal dari alamat yang sama dengan halaman webnya.
      #
      # GeoServer memblokir formulir yang Origin-nya tidak dikenal, sebagai
      # perlindungan CSRF. Karena permintaan melewati Nginx, Origin yang
      # diterima GeoServer adalah alamat publik, bukan localhost.
      #
      # Nama variabelnya CSRF_WHITELIST, TANPA awalan GEOSERVER_. Image
      # kartoza membacanya pada scripts/entrypoint.sh baris 93 dan
      # meneruskannya sebagai -DGEOSERVER_CSRF_WHITELIST. Memakai awalan itu
      # membuat nilainya kosong tanpa pesan galat apa pun.
      #
      # Tanpa daftar ini, pembuatan workspace dan datastore lewat antarmuka
      # gagal dengan "HTTP Status 400 - Origin does not correspond to request".
      #
      # webgisbig.com mencakup seluruh subdomainnya, sehingga satu nilai
      # berlaku untuk semua peserta.
      - CSRF_WHITELIST=webgisbig.com
    volumes:
      # Volume inilah yang membuat workspace, store, dan layer hasil unggahan
      # bertahan setelah container dibuat ulang.
      - ./geoserver-data:/opt/geoserver/data_dir
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    depends_on:
      - nextjs
      - geoserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-webroot:/var/www/certbot
      - ./tls:/etc/nginx/tls
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
