server {
    listen 80;
    server_name _;

    # Batas bawaan Nginx hanya 1 MB, sedangkan model 3D dan berkas GeoJSON
    # hampir selalu lebih besar. Unggahan yang melewatinya ditolak Nginx dengan
    # halaman HTML 413, dan aplikasi melaporkannya sebagai
    # "Unexpected token '<' ... is not valid JSON", tanpa menyebut ukuran.
    #
    # 1024m dipilih supaya Gaussian Splatting hasil rekaman utuh, yang berkisar
    # ratusan MB, tidak perlu dipangkas lebih dahulu. Peramban mengirim
    # Content-Length bersama unggahannya, dan Nginx memeriksa header itu
    # sebelum membaca badannya. Berkas yang kelewat besar karena itu ditolak
    # seketika, bukan setelah menunggu unggahannya selesai.
    client_max_body_size 1024m;

    # Jeda antar potongan badan permintaan yang masih ditoleransi. Bawaannya 60
    # detik, dan itu terlewati pada unggahan besar di jaringan yang lambat atau
    # yang sedang tersendat, dengan gejala koneksi terputus di tengah jalan.
    client_body_timeout 300s;

    # Berkas TLS dibuat di VM, bukan di repo. Direktori ini kosong sampai
    # sertifikat diterbitkan pada bagian 24 panduan deployment, dan include
    # dengan pola yang tidak cocok apa pun bukan error bagi Nginx.
    include /etc/nginx/tls/*.conf;

    # Let's Encrypt memeriksa kepemilikan domain lewat berkas di direktori ini.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Mesin pencari selalu meminta kedua berkas ini di akar domain, sedangkan
    # Next.js menyajikannya di bawah basePath /portal. Tanpa dua blok ini,
    # /robots.txt dan /sitemap.xml membalas 404 di akar domain.
    location = /robots.txt {
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $nextjs_upstream http://nextjs:3000;
        proxy_pass $nextjs_upstream/portal/robots.txt;
    }

    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $nextjs_upstream http://nextjs:3000;
        proxy_pass $nextjs_upstream/portal/sitemap.xml;
    }

    location = / {
        return 302 /portal;
    }

    # Jalur kanonik antarmuka admin GeoServer. Jangan menambahkan redirect dari
    # /portal ke /portal/ di sini. Aplikasi tidak memakai trailingSlash, jadi
    # /portal adalah bentuk kanoniknya sedangkan /portal/ dialihkan oleh Next.js.
    # Redirect dari dua sisi pernah menghasilkan ERR_TOO_MANY_REDIRECTS.
    # Diarahkan langsung ke bentuk kanonik tanpa slash, karena GeoServer
    # mengalihkan /geoserver/web/ ke /geoserver/web. Menyisipkan bentuk berslash
    # hanya menambah satu lompatan yang tidak perlu.
    location = /geoserver {
        return 302 /geoserver/web;
    }

    # Nama service di-resolve saat ada permintaan, bukan saat Nginx start.
    # Tanpa pola ini, Nginx menolak start dengan "host not found in upstream"
    # selama container nextjs belum ada. Padahal geoserver dan nginx sengaja
    # dinyalakan lebih dahulu, sebelum image nextjs dibangun.
    location /geoserver/ {
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $geoserver_upstream http://geoserver:8080;
        rewrite ^/geoserver/(.*)$ /geoserver/$1 break;
        proxy_pass $geoserver_upstream;

        # Host dikirim memakai $http_host supaya GeoServer tahu port publik yang
        # dipakai, bukan 8080 milik container di belakang proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $nextjs_upstream http://nextjs:3000;
        proxy_pass $nextjs_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tanpa baris ini Nginx menulis seluruh badan permintaan ke berkas
        # sementara di dalam container lebih dahulu, baru meneruskannya ke
        # aplikasi. Untuk berkas 1 GB artinya satu salinan penuh ditulis ke
        # disk, dibaca lagi, lalu ditulis ulang oleh aplikasi. Dengan
        # buffering dimatikan, badannya mengalir langsung, sehingga hanya satu
        # salinan yang ditulis dan bilah kemajuan di peramban mengikuti laju
        # kirim yang sebenarnya, bukan laju Nginx menerima ke disk.
        proxy_request_buffering off;

        # Aplikasi menulis berkas ke disk, dan untuk layer 2D meneruskannya ke
        # GeoServer. Keduanya bisa melewati batas 60 detik bawaan Nginx pada
        # berkas besar, dan batas itu juga berbalas halaman HTML, bukan JSON.
        #
        # proxy_send_timeout mengatur jeda saat Nginx mengirim badan permintaan
        # ke aplikasi. Karena buffering dimatikan, pengiriman itu berlangsung
        # selama unggahannya masih berjalan, jadi batasnya harus longgar.
        proxy_send_timeout 1800s;

        # proxy_read_timeout mengatur jeda saat Nginx menunggu balasan
        # aplikasi. Setelah badannya diterima, aplikasi masih menulis berkas ke
        # disk dan menyimpan barisnya ke database.
        proxy_read_timeout 1800s;
    }
}
